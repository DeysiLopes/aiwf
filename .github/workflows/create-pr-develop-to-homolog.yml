name: Auto PR develop → homolog

on:
  push:
    branches:
      - develop

concurrency:
  group: auto-pr-develop-to-homolog
  cancel-in-progress: true

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create or update PR to homolog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --head develop \
            --base homolog \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "PR #$PR_NUMBER already exists — updating body"
            gh pr edit "$PR_NUMBER" \
              --title "chore: promote develop → homolog" \
              --body "Auto-promotion PR\n\n\`develop\` → \`homolog\` (updated at $(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          else
            echo "Creating PR from develop → homolog"
            gh pr create \
              --base homolog \
              --head develop \
              --title "chore: promote develop → homolog" \
              --body "Auto-promotion PR\n\n\`develop\` → \`homolog\`"
          fi
