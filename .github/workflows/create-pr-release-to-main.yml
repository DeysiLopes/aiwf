name: Auto PR release → main

on:
  push:
    branches:
      - 'release/**'

concurrency:
  group: auto-pr-release-to-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="main"
          HEAD="${{ github.ref_name }}"

          if ! gh api repos/${{ github.repository }}/branches/$BASE --jq '.name' &>/dev/null; then
            echo "Branch '$BASE' does not exist. Skipping PR creation."
            exit 0
          fi

          COMMITS_AHEAD=$(gh api repos/${{ github.repository }}/compare/$BASE...$HEAD --jq '.ahead_by' 2>/dev/null || echo "0")
          if [ "$COMMITS_AHEAD" -eq 0 ]; then
            echo "No commits ahead of $BASE. Skipping PR."
            exit 0
          fi

          PR_NUMBER=$(gh pr list \
            --head "$HEAD" \
            --base "$BASE" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "PR #$PR_NUMBER already exists — skipping"
          else
            echo "Creating PR from $HEAD → $BASE"
            gh pr create \
              --base "$BASE" \
              --head "$HEAD" \
              --title "chore: release $HEAD → $BASE" \
              --body "Auto-release PR\n\n\`$HEAD\` → \`$BASE\`"
          fi
