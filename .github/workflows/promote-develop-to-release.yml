name: promote develop → pre-release

on:
  push:
    branches:
      - develop

concurrency:
  group: promote-develop-to-prerelease
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create or update PR develop → pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="pre-release"
          HEAD="develop"

          if ! gh api repos/${{ github.repository }}/branches/$BASE --jq '.name' &>/dev/null; then
            echo "Branch '$BASE' does not exist. Skipping PR creation."
            exit 0
          fi

          COMMITS_AHEAD=$(gh api repos/${{ github.repository }}/compare/$BASE...$HEAD --jq '.ahead_by' 2>/dev/null || echo "0")
          if [ "$COMMITS_AHEAD" -eq 0 ]; then
            echo "No commits ahead of $BASE. Skipping PR."
            exit 0
          fi

          PR_NUMBER=$(gh pr list \
            --head "$HEAD" \
            --base "$BASE" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "PR #$PR_NUMBER already exists — skipping"
          else
            echo "Creating PR from $HEAD → $BASE"
            gh pr create \
              --base "$BASE" \
              --head "$HEAD" \
              --title "chore: promote develop → pre-release" \
              --body "Auto-promotion PR\n\n\`$HEAD\` → \`$BASE\`"
          fi
