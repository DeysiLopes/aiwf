id: EXAMPLE-001
name: "Exemplo de Pipeline AIWF"
description: >
  Workflow de exemplo que demonstra a estrutura completa do orquestrador:
  fases, skills, entradas/saidas, e como o agente deve criar novos workflows.
tdd: false
artifacts_dir: ".agents/artifacts"
steps:
  - id: workflow-kickoff
    name: "Kickoff"
    skill: "skills/workflow-kickoff/SKILL.md"
    type: prompt
    on_existing: skip
    output:
      artifact: prompt-inicial.md
    input:
      story_title: "Titulo da Historia"
      story_description: "Descricao detalhada do que precisa ser feito"
      acceptance_criteria: |
        - Criterio 1
        - Criterio 2
      context: "Contexto do projeto e motivacao"

  - id: verify-install
    name: "Verificar ambiente"
    skill: "skills/verify-install/SKILL.md"
    type: prompt
    on_existing: skip
    output:
      artifact: verify-report.md
    input:
      context: "Ambiente do projeto — verificar dependencias e ferramentas"

  - id: git-setup
    name: "Setup do repositorio"
    skill: "skills/git-flow/SKILL.md"
    type: prompt
    on_existing: skip
    output:
      artifact: git-setup.md
    input:
      action: "setup"
      story_id: "EXAMPLE-001"
      base_branch: "develop"

  - id: specify
    name: "Especificacao tecnica"
    skill: "skills/specify/SKILL.md"
    type: prompt
    on_existing: skip
    output:
      artifact: specification.md
    input:
      tech_stack: "Node.js 20+"
      constraints: "Restricoes tecnicas e de negocio"

  - id: clarify
    name: "Clarificacao"
    skill: "skills/clarify/SKILL.md"
    type: prompt
    on_existing: skip
    output:
      artifact: clarification.md
    input:
      user_story: "{{workflow.description}}"
      specification: "{{artifacts.specification}}"
      context: "{{context}}"

  - id: context
    name: "Modelo de dominio (linguagem ubiqua)"
    skill: "skills/context/SKILL.md"
    type: prompt
    on_existing: skip
    output:
      artifact: CONTEXT.md
    input:
      user_story: "{{workflow.description}}"
      specification: "{{artifacts.specification}}"
      clarification: "{{artifacts.clarification}}"

  - id: plan
    name: "Plano de implementacao"
    skill: "skills/plan/SKILL.md"
    type: prompt
    on_existing: skip
    output:
      artifact: plan.md
    input:
      specification: "{{artifacts.specification}}"
      clarification: "{{artifacts.clarification}}"

  - id: tasks
    name: "Tarefas atomicas"
    skill: "skills/tasks/SKILL.md"
    type: prompt
    on_existing: skip
    output:
      artifact: tasks.md
    input:
      plan: "{{artifacts.plan}}"

  - id: implement
    name: "Implementacao"
    skill: "skills/implement/SKILL.md"
    type: prompt
    on_existing: overwrite
    output:
      artifact: implementacao.md
    input:
      tasks: "{{artifacts.tasks}}"
      language: "javascript"
      output_file: "src/example.js"

  - id: test
    name: "Testes"
    skill: "skills/test/SKILL.md"
    type: prompt
    on_existing: overwrite
    output:
      artifact: testes.md
    input:
      tasks: "{{artifacts.tasks}}"
      implementation: "{{artifacts.implementacao}}"
      test_framework: "jest"
      coverage_target: "80%"

  - id: code-reviewer
    name: "Code review em dois eixos"
    type: parallel
    on_existing: overwrite
    parallel_steps:
      - id: review-standards
        name: "Review: standards e boas praticas"
        skill: "skills/code-reviewer/SKILL.md"
        on_existing: overwrite
        output:
          artifact: review-standards.md
        input:
          review_focus: "eixo-1"
          specification: "{{artifacts.specification}}"
          implementation: "{{artifacts.implementacao}}"
          context: "{{context}}"
      - id: review-spec
        name: "Review: fidelidade a spec"
        skill: "skills/code-reviewer/SKILL.md"
        on_existing: overwrite
        output:
          artifact: review-spec.md
        input:
          review_focus: "eixo-2"
          specification: "{{artifacts.specification}}"
          implementation: "{{artifacts.implementacao}}"
          context: "{{context}}"

  - id: closer
    name: "Relatorio final"
    skill: "skills/closer/SKILL.md"
    type: prompt
    on_existing: overwrite
    output:
      artifact: relatorio-final.md
    input:
      review: "{{artifacts.review-standards}}"
      review_spec: "{{artifacts.review-spec}}"

  - id: ci-monitor
    name: "Monitor de CI"
    skill: "skills/ci-monitor/SKILL.md"
    type: prompt
    on_existing: overwrite
    output:
      artifact: ci-report.md
    input:
      pipeline_url: "url do pipeline"