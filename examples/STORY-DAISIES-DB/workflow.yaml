id: STORY-DAISIES-DB
name: "Daisies — Single-Table DynamoDB Database Layer"
description: >
  Como desenvolvedora, quero implementar a camada de banco de dados do Daisies
  usando DynamoDB single-table com o schema definido nos specs, incluindo todas as
  entidades (PROFILE, TABLE, MENU, ORDER, SAGA, CASH, KANBAN, INTEGRATION, EVENT,
  IDEMPOTENCY), as GSIs (StatusIndex, TableIndex), e a configuração Terraform,
  seguindo o padrão hexagonal com Ports & Adapters, para garantir persistência
  escalável e de baixa latência para o MVP.
artifacts_dir: ./artifacts/STORY-DAISIES-DB
tdd: false

steps:
  - id: workflow-kickoff
    name: "Kickoff"
    skill: skills/workflow-kickoff/SKILL.md
    input:
      story_title: "Daisies Database Layer"
      story_description: "{{workflow.description}}"
      acceptance_criteria: "Schema DynamoDB validado, GSIs cobrindo access patterns, Terraform aplicável"
      context: |
        ## Modelo de dados — DynamoDB single-table
        Tabela `daisies-core`, particionada por tenant.

        | PK | SK | Entidade |
        |---|---|---|
        | `TENANT#{restaurantId}` | `PROFILE` | Dados cadastrais |
        | `TENANT#{restaurantId}` | `TABLE#{tableId}` | Mesa e estado |
        | `TENANT#{restaurantId}` | `MENU#{itemId}` | Item de cardápio |
        | `TENANT#{restaurantId}` | `ORDER#{orderId}` | Pedido |
        | `TENANT#{restaurantId}` | `SAGA#{sagaId}` | Estado da SAGA |
        | `TENANT#{restaurantId}` | `SAGA#{sagaId}#STEP#{timestamp}` | Histórico append-only |
        | `TENANT#{restaurantId}` | `CASH#{cashId}` | Movimento de caixa |
        | `TENANT#{restaurantId}` | `KANBAN#{orderId}` | Status no board da cozinha |
        | `TENANT#{restaurantId}` | `INTEGRATION#IFOOD` | Estado da integração |
        | `TENANT#{restaurantId}` | `EVENT#{timestamp}#{eventId}` | Timeline de eventos |
        | `TENANT#{restaurantId}` | `IDEMPOTENCY#{externalOrderId}` | Chave idempotente |

        GSI1 — StatusIndex: PK=`TENANT#{id}#STATUS#{status}`, SK=`ORDER#{createdAt}`
        GSI2 — TableIndex: PK=`TENANT#{id}#TABLE#{tableId}`, SK=`ORDER#{createdAt}`

        Atributos: TTL (eventos, idempotency), condicional write para idempotência.
        Terraform: PAY_PER_REQUEST, PITR só em produção, encryption enabled.
    output:
      artifact: prompt-inicial.md
    on_existing: skip

  - id: verify-install
    name: "Verificar ambiente"
    skill: skills/verify-install/SKILL.md
    input:
      context: "Terraform + AWS DynamoDB — verificar terraform, aws-cli, node, git"
    output:
      artifact: verify-report.md
    on_existing: skip

  - id: git-setup
    name: "Setup do repositório"
    skill: skills/git-flow/SKILL.md
    input:
      action: "setup"
      story_id: "STORY-DAISIES-DB"
      base_branch: "develop"
    output:
      artifact: git-setup.md
    on_existing: skip

  - id: specify
    name: "Especificação técnica"
    skill: skills/specify/SKILL.md
    input:
      prompt: "{{artifacts.prompt-inicial}}"
    output:
      artifact: specification.md
    on_existing: skip

  - id: clarify
    name: "Clarificação"
    skill: skills/clarify/SKILL.md
    input:
      user_story: "{{workflow.description}}"
      specification: "{{artifacts.specification}}"
    output:
      artifact: clarification.md
    on_existing: skip

  - id: plan
    name: "Plano de implementação"
    skill: skills/plan/SKILL.md
    input:
      specification: "{{artifacts.specification}}"
      clarification: "{{artifacts.clarification}}"
    output:
      artifact: plan.md
    on_existing: skip

  - id: tasks
    name: "Tarefas atômicas"
    skill: skills/tasks/SKILL.md
    input:
      plan: "{{artifacts.plan}}"
    output:
      artifact: tasks.md
    on_existing: skip

  - id: implement
    name: "Implementação"
    skill: skills/implement/SKILL.md
    input:
      tasks: "{{artifacts.tasks}}"
    output:
      artifact: implementation.md
    on_existing: overwrite

  - id: test
    name: "Testes"
    skill: skills/test/SKILL.md
    input:
      tasks: "{{artifacts.tasks}}"
      implementation: "{{artifacts.implementation}}"
    output:
      artifact: teste.md
    on_existing: overwrite

  - id: code-reviewer
    name: "Revisão"
    skill: skills/code-reviewer/SKILL.md
    input:
      acceptance: "{{workflow.description}}"
    output:
      artifact: review.md
    on_existing: overwrite

  - id: review
    name: "Revisão humana"
    type: human_pause
    prompt: >
      Revise os artefatos gerados em {{workflow.artifacts_dir}}.
      Quando estiver pronto, execute: aiwf resume {{workflow.id}}

  - id: closer
    name: "Finalizar"
    skill: skills/closer/SKILL.md
    input:
      review: "{{artifacts.review}}"
    output:
      artifact: closure.md
    on_existing: overwrite

  - id: ci-monitor
    name: "Monitorar CI"
    skill: skills/ci-monitor/SKILL.md
    input:
      pipeline_url: "url do pipeline"
    output:
      artifact: ci-report.md
    on_existing: overwrite
