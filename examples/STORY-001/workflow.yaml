id: STORY-001
name: "Criar módulo de autenticação"
description: >
  Como desenvolvedora, quero criar um módulo de autenticação com login e refresh token
  para permitir acesso seguro à API e renovação de sessão sem novo login frequente.
artifacts_dir: ./artifacts/STORY-001
tdd: false

steps:
  - id: workflow-kickoff
    name: "Kickoff"
    skill: skills/workflow-kickoff/SKILL.md
    input:
      story_title: "Criar módulo de autenticação"
      story_description: "{{workflow.description}}"
      acceptance_criteria: "Login e refresh token funcionando"
      context: "Módulo de autenticação para API REST"
    output:
      artifact: prompt-inicial.md
    on_existing: skip

  - id: verify-install
    name: "Verificar ambiente"
    skill: skills/verify-install/SKILL.md
    input:
      context: "Node.js API REST com JWT — verificar node, npm, git"
    output:
      artifact: verify-report.md
    on_existing: skip

  - id: git-setup
    name: "Setup do repositório"
    skill: skills/git-flow/SKILL.md
    input:
      action: "setup"
      story_id: "STORY-001"
      base_branch: "develop"
    output:
      artifact: git-setup.md
    on_existing: skip

  - id: specify
    name: "Especificação técnica"
    skill: skills/specify/SKILL.md
    input:
      prompt: "{{artifacts.prompt-inicial}}"
    output:
      artifact: specification.md
    on_existing: skip

  - id: clarify
    name: "Clarificação"
    skill: skills/clarify/SKILL.md
    input:
      user_story: "{{workflow.description}}"
      specification: "{{artifacts.specification}}"
    output:
      artifact: clarification.md
    on_existing: skip

  - id: plan
    name: "Plano de implementação"
    skill: skills/plan/SKILL.md
    input:
      specification: "{{artifacts.specification}}"
      clarification: "{{artifacts.clarification}}"
    output:
      artifact: plan.md
    on_existing: skip

  - id: tasks
    name: "Tarefas atômicas"
    skill: skills/tasks/SKILL.md
    input:
      plan: "{{artifacts.plan}}"
    output:
      artifact: tasks.md
    on_existing: skip

  - id: implement
    name: "Implementação"
    skill: skills/implement/SKILL.md
    input:
      tasks: "{{artifacts.tasks}}"
    output:
      artifact: implementation.md
    on_existing: overwrite

  - id: test
    name: "Testes"
    skill: skills/test/SKILL.md
    input:
      tasks: "{{artifacts.tasks}}"
      implementation: "{{artifacts.implementation}}"
    output:
      artifact: teste.md
    on_existing: overwrite

  - id: code-reviewer
    name: "Revisão"
    skill: skills/code-reviewer/SKILL.md
    input:
      acceptance: "{{workflow.description}}"
    output:
      artifact: review.md
    on_existing: overwrite

  - id: review
    name: "Revisão humana"
    type: human_pause
    prompt: >
      Revise os artefatos gerados em {{workflow.artifacts_dir}}.
      Quando estiver pronto, execute: aiwf resume {{workflow.id}}

  - id: closer
    name: "Finalizar"
    skill: skills/closer/SKILL.md
    input:
      review: "{{artifacts.review}}"
    output:
      artifact: closure.md
    on_existing: overwrite

  - id: ci-monitor
    name: "Monitorar CI"
    skill: skills/ci-monitor/SKILL.md
    input:
      pipeline_url: "url do pipeline"
    output:
      artifact: ci-report.md
    on_existing: overwrite
