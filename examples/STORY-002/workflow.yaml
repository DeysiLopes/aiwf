id: STORY-002
name: "Implementar feature de reset de senha (TDD)"
description: >
  Como usuária, quero poder resetar minha senha através de um link enviado por e-mail
  para garantir que posso recuperar o acesso à minha conta de forma segura.
artifacts_dir: ./artifacts/STORY-002
tdd: true

steps:
  - id: prompt-builder
    name: "Estruturar contexto inicial"
    skill: skills/prompt-builder.md
    input:
      user_story: "{{workflow.description}}"
    output:
      artifact: prompt-inicial.md
    on_existing: skip

  - id: sdd-specify
    name: "Gerar especificação técnica"
    skill: skills/sdd-specify.md
    input:
      prompt: "{{artifacts.prompt-inicial}}"
    output:
      artifact: specification.md
    on_existing: skip

  - id: sdd-clarify
    name: "Clarear ambiguidades da story"
    skill: skills/sdd-clarify.md
    input:
      user_story: "{{workflow.description}}"
      specification: "{{artifacts.specification}}"
    output:
      artifact: clarification.md
    on_existing: skip

  - id: sdd-plan
    name: "Gerar plano de implementação"
    skill: skills/sdd-plan.md
    input:
      specification: "{{artifacts.specification}}"
      clarification: "{{artifacts.clarification}}"
    output:
      artifact: plan.md
    on_existing: skip

  - id: sdd-tasks
    name: "Decompor em tarefas atômicas"
    skill: skills/sdd-tasks.md
    input:
      plan: "{{artifacts.plan}}"
    output:
      artifact: tasks.md
    on_existing: skip

  # Em modo TDD, sdd-teste roda ANTES de sdd-implement
  - id: sdd-teste
    name: "Gerar testes primeiro (TDD)"
    skill: skills/sdd-teste.md
    input:
      tasks: "{{artifacts.tasks}}"
      implementation: "{{artifacts.implementation}}"
      acceptance: "{{artifacts.specification}}"
    output:
      artifact: teste.md
    on_existing: skip

  - id: sdd-implement
    name: "Implementar para passar nos testes"
    skill: skills/sdd-implement.md
    input:
      tasks: "{{artifacts.tasks}}"
      tests: "{{artifacts.teste}}"
    output:
      artifact: implementation.md
    on_existing: skip

  - id: code-reviewr
    name: "Revisar qualidade da entrega"
    skill: skills/code-reviewr.md
    input:
      acceptance: "{{workflow.description}}"
      quality_criteria: "DoD padrão da equipe: testes verdes, código revisado, documentação mínima"
    output:
      artifact: review.md
    on_existing: skip

  - id: review
    name: "Revisão humana"
    type: human_pause
    prompt: >
      Revise os artefatos gerados em {{workflow.artifacts_dir}}.
      Verifique se todos os documentos estão adequados.
      Quando estiver pronto, execute: aiwf resume {{workflow.id}}
    depends_on:
      - code-reviewr

  - id: sdd-closer
    name: "Encerrar esteira"
    skill: skills/sdd-closer.md
    input:
      review: "{{artifacts.review}}"
    output:
      artifact: closure.md
    on_existing: skip
