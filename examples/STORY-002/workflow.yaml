id: STORY-002
name: "Implementar feature de reset de senha (TDD)"
description: >
  Como usuária, quero poder resetar minha senha através de um link enviado por e-mail
  para garantir que posso recuperar o acesso à minha conta de forma segura.
artifacts_dir: ./artifacts/STORY-002
tdd: true

steps:
  - id: workflow-kickoff
    name: "Kickoff"
    skill: skills/workflow-kickoff/SKILL.md
    input:
      story_title: "Reset de senha"
      story_description: "{{workflow.description}}"
      acceptance_criteria: "Link de reset enviado por email, token expira em 1h"
      context: "Feature de reset de senha"
    output:
      artifact: prompt-inicial.md
    on_existing: skip

  - id: verify-install
    name: "Verificar ambiente"
    skill: skills/verify-install/SKILL.md
    input:
      context: "Node.js API com envio de email — verificar node, npm, git"
    output:
      artifact: verify-report.md
    on_existing: skip

  - id: git-setup
    name: "Setup do repositório"
    skill: skills/git-flow/SKILL.md
    input:
      action: "setup"
      story_id: "STORY-002"
      base_branch: "develop"
    output:
      artifact: git-setup.md
    on_existing: skip

  - id: specify
    name: "Especificação técnica"
    skill: skills/specify/SKILL.md
    input:
      prompt: "{{artifacts.prompt-inicial}}"
    output:
      artifact: specification.md
    on_existing: skip

  - id: clarify
    name: "Clarificação"
    skill: skills/clarify/SKILL.md
    input:
      user_story: "{{workflow.description}}"
      specification: "{{artifacts.specification}}"
    output:
      artifact: clarification.md
    on_existing: skip

  - id: plan
    name: "Plano de implementação"
    skill: skills/plan/SKILL.md
    input:
      specification: "{{artifacts.specification}}"
      clarification: "{{artifacts.clarification}}"
    output:
      artifact: plan.md
    on_existing: skip

  - id: tasks
    name: "Tarefas atômicas"
    skill: skills/tasks/SKILL.md
    input:
      plan: "{{artifacts.plan}}"
    output:
      artifact: tasks.md
    on_existing: skip

  # TDD: test before implement
  - id: test
    name: "Testes primeiro (TDD)"
    skill: skills/test/SKILL.md
    input:
      tasks: "{{artifacts.tasks}}"
      acceptance: "{{artifacts.specification}}"
    output:
      artifact: teste.md
    on_existing: overwrite

  - id: implement
    name: "Implementar"
    skill: skills/implement/SKILL.md
    input:
      tasks: "{{artifacts.tasks}}"
      tests: "{{artifacts.teste}}"
    output:
      artifact: implementation.md
    on_existing: overwrite

  - id: code-reviewer
    name: "Revisão"
    skill: skills/code-reviewer/SKILL.md
    input:
      acceptance: "{{workflow.description}}"
    output:
      artifact: review.md
    on_existing: overwrite

  - id: review
    name: "Revisão humana"
    type: human_pause
    prompt: >
      Revise os artefatos gerados em {{workflow.artifacts_dir}}.
      Quando estiver pronto, execute: aiwf resume {{workflow.id}}

  - id: closer
    name: "Finalizar"
    skill: skills/closer/SKILL.md
    input:
      review: "{{artifacts.review}}"
    output:
      artifact: closure.md
    on_existing: overwrite

  - id: ci-monitor
    name: "Monitorar CI"
    skill: skills/ci-monitor/SKILL.md
    input:
      pipeline_url: "url do pipeline"
    output:
      artifact: ci-report.md
    on_existing: overwrite
