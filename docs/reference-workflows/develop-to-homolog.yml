name: develop → homolog (pre-release)

on:
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Derive pre-release version
        id: version
        run: echo "version=pre-$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

  pre-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create pre-release tag
        run: |
          VERSION="${{ needs.ci.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.ci.outputs.version }}
          name: "pre-release ${{ needs.ci.outputs.version }}"
          prerelease: true
          generate_release_notes: true

  promote-to-homolog:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homolog

      - name: Merge develop into homolog
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git merge origin/develop --no-edit --allow-unrelated-histories || true
          git push origin homolog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
