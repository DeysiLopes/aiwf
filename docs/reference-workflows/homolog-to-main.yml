name: homolog → main (release)

on:
  push:
    branches:
      - homolog

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Derive release version
        id: version
        run: echo "version=release-$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release tag
        run: |
          VERSION="${{ needs.ci.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.ci.outputs.version }}
          name: "release ${{ needs.ci.outputs.version }}"
          prerelease: false
          generate_release_notes: true

  merge-to-main:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Merge homolog into main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git merge origin/homolog --no-edit --allow-unrelated-histories || true
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
