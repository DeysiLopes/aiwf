id: STORY-daisies
name: "Ideia para o projeto Daisies"
description: >
  Ideia inicial para o Daisies — descreva aqui o que você quer construir.
artifacts_dir: /tmp/opencode/STORY-daisies/artifacts
tdd: false

steps:
  - id: workflow-kickoff
    name: "Kickoff — estruturar contexto inicial"
    skill: skills/workflow-kickoff/SKILL.md
    input:
      story_title: "Projeto Daisies"
      story_description: "{{input.raw_idea}}"
      acceptance_criteria: "A ser definido"
      context: "Projeto pessoal Daisies — aplicação de delivery/restaurante"
    output:
      artifact: prompt-inicial.md
    on_existing: skip

  - id: brainstorming
    name: "Especificação e clarificação"
    skill: skills/brainstorming/SKILL.md
    input:
      tech_stack: "Node.js 20+"
      constraints: "Projeto pessoal, sem restrições corporativas"
    output:
      artifact: specification.md
    on_existing: skip

  - id: cloud-solution-architect
    name: "Plano de implementação"
    skill: skills/cloud-solution-architect/SKILL.md
    input:
      specification: "{{artifacts.specification}}"
    output:
      artifact: plan.md
    on_existing: skip

  - id: engineering-best-practices
    name: "Decompor em tarefas"
    skill: skills/engineering-best-practices/SKILL.md
    input:
      plan: "{{artifacts.plan}}"
    output:
      artifact: tasks.md
    on_existing: skip

  - id: sdd-implement
    name: "Implementação"
    skill: skills/sdd-implement.md
    input:
      tasks: "{{artifacts.tasks}}"
    output:
      artifact: implementation.md
    on_existing: overwrite

  - id: sdd-teste
    name: "Estratégia de testes"
    skill: skills/sdd-teste.md
    input:
      tasks: "{{artifacts.tasks}}"
      implementation: "{{artifacts.implementation}}"
    output:
      artifact: teste.md
    on_existing: overwrite

  - id: code-reviewer
    name: "Revisão de código"
    skill: skills/code-reviewer/SKILL.md
    input:
      acceptance: "{{workflow.description}}"
      quality_criteria: "DoD padrão"
    output:
      artifact: review.md
    on_existing: overwrite

  - id: closer
    name: "Finalizar"
    skill: skills/closer/SKILL.md
    input:
      review: "{{artifacts.review}}"
    output:
      artifact: closure.md
    on_existing: overwrite

  - id: ci-monitor
    name: "Monitorar CI"
    skill: skills/ci-monitor/SKILL.md
    input:
      pipeline_url: "url do CI"
    output:
      artifact: ci-report.md
    on_existing: overwrite

  - id: review
    name: "Revisão humana"
    type: human_pause
    prompt: >
      Revise os artefatos gerados.
      Quando estiver pronto, execute: aiwf resume {{workflow.id}}
